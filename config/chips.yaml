# Apple Silicon reference data used by the fit calculator.
#
# memory_bandwidth_gbs: peak unified-memory bandwidth in GB/s (vendor spec).
# Values marked `verified: false` are placeholders and MUST be checked against
# Apple's tech specs before relying on speed estimates. A chip with
# memory_bandwidth_gbs: null still gets a memory-fit verdict, but no tok/s estimate.
#
# Keys are referenced from hardware_profiles.yaml (field `chip`).

chips:
  m1-max-32c:
    display_name: "M1 Max (32-core GPU)"
    memory_bandwidth_gbs: 400
    verified: true
