# Install once:  uv run pre-commit install
# Run on all:    uv run pre-commit run --all-files
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        args: ["--maxkb=500"]
      - id: detect-private-key

  # Use the project's pinned ruff (uv.lock) instead of a separate hook version.
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check --fix
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: no-dotenv
        name: forbid committing .env files
        entry: ".env files must not be committed (use .env.sample)"
        language: fail
        files: '(^|/)\.env(\..*)?$'
        exclude: '\.env\.sample$'
