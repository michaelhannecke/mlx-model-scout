name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow only reads the repo (no releases, no comments, no pushes).
permissions:
  contents: read

jobs:
  lint-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install Python 3.14
        run: uv python install
      - name: Sync dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format check
        run: uv run ruff format --check .
      - name: Tests
        run: uv run pytest -q

  # Apple `container` cannot run on GitHub runners (Linux, or macOS VMs without
  # nested virtualization). The OCI image is therefore validated with Docker.
  container-image:
    runs-on: ubuntu-latest
    needs: lint-test
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t mlx-model-scout:ci .
      - name: Smoke test (import + settings)
        run: docker run --rm mlx-model-scout:ci python -c "from mlx_model_scout.server import create_app; create_app()"
