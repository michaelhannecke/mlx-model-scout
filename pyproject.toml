[project]
name = "mlx-model-scout"
version = "0.1.0"
description = "MCP server that scouts Hugging Face for Apple-MLX models and estimates how well they fit given Apple Silicon hardware - fully local."
readme = "README.md"
authors = [
    { name = "Michael Hannecke", email = "michael.hannecke@bluetuple.ai" }
]
requires-python = ">=3.14.0"
license = "MIT"
keywords = ["mcp", "fastmcp", "mlx", "apple-silicon", "local-llm", "agents"]
dependencies = [
    "fastmcp>=4.1.4",
    "httpx>=0.28.1",
    "openai>=3.40.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.2",
    "pyyaml>=6.0.3",
    "rich>=15.0.0",
    "sqlmodel>=0.0.48",
]

[project.scripts]
mlx-model-scout = "mlx_model_scout:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pre-commit>=4.7.0",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1",
    "ruff>=0.17.3",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["client"]  # tests import client/local_client.py as `local_client`
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 110
target-version = "py314"
src = ["src", "tests", "client"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ASYNC"]
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B", "SIM"]

[tool.ruff.format]
quote-style = "double"
